<!doctype html>
<html lang="pt-BR">
  <head>

    <meta name="robots" content="noindex" />
    <title>Redirecionando — Higor Maranhão</title>
  </head>
  <body>
    <p>Redirecionando para o portfólio…</p>
    <script>
      const destinations = {
        '/about': '/#sobre',
        '/skills': '/#stack',
        '/projects': '/#projetos',
        '/contact': '/#contato',
      };

      window.location.replace(destinations[window.location.pathname] ?? '/');
    </script>
  </body>
